<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <!-- Rally Background with American Flag and Crowd -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14213d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1527;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="1920" height="1080" fill="url(#skyGradient)"/>

  <!-- Subtle Stars -->
  <circle cx="200" cy="100" r="2" fill="#ffffff" opacity="0.6"/>
  <circle cx="400" cy="150" r="1.5" fill="#ffffff" opacity="0.5"/>
  <circle cx="800" cy="80" r="2" fill="#ffffff" opacity="0.7"/>
  <circle cx="1200" cy="120" r="1.5" fill="#ffffff" opacity="0.4"/>
  <circle cx="1600" cy="90" r="2" fill="#ffffff" opacity="0.6"/>

  <!-- American Flag Silhouette -->
  <g opacity="0.3">
    <rect x="1400" y="200" width="400" height="280" fill="#C4232C"/>
    <rect x="1400" y="220" width="400" height="20" fill="#ffffff"/>
    <rect x="1400" y="260" width="400" height="20" fill="#ffffff"/>
    <rect x="1400" y="300" width="400" height="20" fill="#ffffff"/>
    <rect x="1400" y="340" width="400" height="20" fill="#ffffff"/>
    <rect x="1400" y="380" width="400" height="20" fill="#ffffff"/>
    <rect x="1400" y="420" width="400" height="20" fill="#ffffff"/>
    <rect x="1400" y="460" width="400" height="20" fill="#ffffff"/>
    <rect x="1400" y="200" width="160" height="160" fill="#14213d"/>
  </g>

  <!-- Crowd Silhouettes -->
  <g opacity="0.4">
    <ellipse cx="300" cy="900" rx="100" ry="180" fill="#000000"/>
    <ellipse cx="500" cy="920" rx="90" ry="160" fill="#000000"/>
    <ellipse cx="700" cy="880" rx="110" ry="200" fill="#000000"/>
    <ellipse cx="900" cy="910" rx="95" ry="170" fill="#000000"/>
    <ellipse cx="1100" cy="890" rx="105" ry="190" fill="#000000"/>
    <ellipse cx="1300" cy="900" rx="100" ry="180" fill="#000000"/>
    <ellipse cx="1500" cy="920" rx="90" ry="160" fill="#000000"/>
    <ellipse cx="1700" cy="880" rx="110" ry="200" fill="#000000"/>
  </g>

  <!-- Stage/Platform Glow -->
  <ellipse cx="960" cy="700" rx="600" ry="100" fill="#BF9B30" opacity="0.15"/>

  <!-- Text Overlay Area (lighter for readability) -->
  <rect width="1920" height="1080" fill="#14213d" opacity="0.3"/>
</svg>
