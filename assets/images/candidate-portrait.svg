<svg width="800" height="1000" xmlns="http://www.w3.org/2000/svg">
  <!-- Professional Candidate Portrait -->
  <defs>
    <linearGradient id="portraitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8f9fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e9ecef;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#portraitBg)"/>

  <!-- Suit Jacket -->
  <path d="M 300 600 Q 250 650, 200 1000 L 600 1000 Q 550 650, 500 600 Z" fill="#14213d"/>

  <!-- Shirt -->
  <rect x="340" y="600" width="120" height="400" fill="#ffffff"/>

  <!-- Tie -->
  <path d="M 390 600 L 400 1000 L 410 600 Z" fill="#C4232C"/>

  <!-- Head/Face (simplified silhouette) -->
  <ellipse cx="400" cy="400" rx="130" ry="160" fill="#ced4da"/>

  <!-- Hair -->
  <ellipse cx="400" cy="300" rx="135" ry="100" fill="#6c757d"/>

  <!-- Flag Pin on Lapel -->
  <rect x="520" y="700" width="30" height="20" fill="#C4232C"/>
  <rect x="520" y="700" width="15" height="10" fill="#14213d"/>

  <!-- Professional Overlay -->
  <rect width="800" height="1000" fill="#14213d" opacity="0.05"/>

  <!-- Subtle Frame Effect -->
  <rect x="20" y="20" width="760" height="960" fill="none" stroke="#BF9B30" stroke-width="3"/>
</svg>
