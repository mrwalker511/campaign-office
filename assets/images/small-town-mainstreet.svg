<svg width="1600" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- Small Town Main Street -->
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87CEEB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="600" fill="url(#skyGrad)"/>

  <!-- Road -->
  <polygon points="0,600 200,500 1400,500 1600,600 1600,900 0,900" fill="#6c757d"/>

  <!-- Road Markings -->
  <rect x="750" y="520" width="100" height="10" fill="#ffd700"/>
  <rect x="750" y="560" width="100" height="10" fill="#ffd700"/>
  <rect x="750" y="600" width="100" height="10" fill="#ffd700"/>

  <!-- Building 1 (Left) - Brick -->
  <rect x="50" y="250" width="250" height="250" fill="#9e0e14"/>
  <rect x="80" y="280" width="60" height="80" fill="#87CEEB"/>
  <rect x="160" y="280" width="60" height="80" fill="#87CEEB"/>
  <rect x="80" y="380" width="60" height="80" fill="#87CEEB"/>
  <rect x="160" y="380" width="60" height="80" fill="#87CEEB"/>
  <rect x="110" y="420" width="80" height="80" fill="#6c757d"/>

  <!-- Building 2 (Center Left) - Store -->
  <rect x="320" y="200" width="280" height="300" fill="#f8f9fa"/>
  <rect x="340" y="220" width="80" height="100" fill="#87CEEB"/>
  <rect x="440" y="220" width="80" height="100" fill="#87CEEB"/>
  <rect x="340" y="340" width="80" height="100" fill="#87CEEB"/>
  <rect x="440" y="340" width="80" height="100" fill="#87CEEB"/>
  <rect x="370" y="420" width="120" height="80" fill="#14213d"/>
  <rect x="320" y="180" width="280" height="20" fill="#C4232C"/>
  <text x="460" y="196" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">MAIN STREET STORE</text>

  <!-- Building 3 (Center) - Town Hall -->
  <rect x="620" y="150" width="360" height="350" fill="#f1f3f5"/>
  <polygon points="620,150 800,80 980,150" fill="#14213d"/>
  <rect x="720" y="200" width="160" height="200" fill="#14213d"/>
  <rect x="740" y="220" width="50" height="70" fill="#87CEEB"/>
  <rect x="810" y="220" width="50" height="70" fill="#87CEEB"/>
  <rect x="740" y="310" width="50" height="70" fill="#87CEEB"/>
  <rect x="810" y="310" width="50" height="70" fill="#87CEEB"/>
  <rect x="765" y="420" width="70" height="80" fill="#6c757d"/>

  <!-- Flag Pole in Front of Town Hall -->
  <line x1="700" y1="500" x2="700" y2="250" stroke="#6c757d" stroke-width="4"/>
  <rect x="680" y="260" width="60" height="40" fill="#C4232C"/>
  <rect x="680" y="265" width="60" height="3" fill="#ffffff"/>
  <rect x="680" y="273" width="60" height="3" fill="#ffffff"/>
  <rect x="680" y="281" width="60" height="3" fill="#ffffff"/>
  <rect x="680" y="289" width="60" height="3" fill="#ffffff"/>
  <rect x="680" y="260" width="24" height="20" fill="#14213d"/>

  <!-- Building 4 (Center Right) - Cafe -->
  <rect x="1000" y="220" width="240" height="280" fill="#fff8dc"/>
  <rect x="1020" y="250" width="70" height="90" fill="#87CEEB"/>
  <rect x="1110" y="250" width="70" height="90" fill="#87CEEB"/>
  <rect x="1050" y="420" width="100" height="80" fill="#C4232C"/>
  <rect x="1000" y="200" width="240" height="20" fill="#14213d"/>
  <text x="1120" y="216" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#BF9B30" text-anchor="middle">CAFE</text>

  <!-- Building 5 (Right) - Shop -->
  <rect x="1260" y="270" width="220" height="230" fill="#e9ecef"/>
  <rect x="1280" y="300" width="60" height="80" fill="#87CEEB"/>
  <rect x="1360" y="300" width="60" height="80" fill="#87CEEB"/>
  <rect x="1310" y="420" width="80" height="80" fill="#6c757d"/>

  <!-- Campaign Sign on Pole -->
  <rect x="500" y="550" width="120" height="80" fill="#14213d" stroke="#BF9B30" stroke-width="3"/>
  <text x="560" y="580" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">VOTE</text>
  <text x="560" y="605" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#BF9B30" text-anchor="middle">2026</text>
  <rect x="555" y="630" width="10" height="70" fill="#6c757d"/>

  <!-- Sidewalk -->
  <rect x="0" y="500" width="1600" height="20" fill="#adb5bd"/>

  <!-- Trees -->
  <ellipse cx="150" cy="480" rx="40" ry="60" fill="#28a745"/>
  <rect x="145" y="500" width="10" height="50" fill="#6c757d"/>

  <ellipse cx="900" cy="480" rx="40" ry="60" fill="#28a745"/>
  <rect x="895" y="500" width="10" height="50" fill="#6c757d"/>
</svg>
